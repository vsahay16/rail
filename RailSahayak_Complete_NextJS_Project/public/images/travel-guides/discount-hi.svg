<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"><title>बड़ी छूट। · क्या बिल भी कम?</title><g font-family="Noto Sans Devanagari, Noto Sans, Arial, sans-serif"><rect x="0" y="0" width="1200" height="630" rx="0" fill="#f6f2e9" stroke="none"/><circle cx="1150" cy="50" r="230" fill="#e4ede5"/><rect x="55" y="45" width="110" height="36" rx="18" fill="#087f78" stroke="none"/><text x="76" y="70" font-size="22" fill="white" font-weight="750">RailQ</text><text x="55" y="130" font-size="16" fill="#087f78" font-weight="700">यात्रा गाइड</text><text x="55" y="230" font-size="43" fill="#153647" font-weight="750">बड़ी छूट।</text><text x="55" y="289" font-size="43" fill="#153647" font-weight="750">क्या बिल भी कम?</text><text x="55" y="370" font-size="25" fill="#153647" font-weight="500">प्रतिशत नहीं,</text><text x="55" y="404" font-size="25" fill="#153647" font-weight="500">देय रकम की तुलना करें।</text><path d="M55 510 L420 510" stroke="#bfd2ca" stroke-width="3" fill="none"/><text x="55" y="548" font-size="19" fill="#087f78" font-weight="500">सरल जानकारी · बेहतर तैयारी</text><rect x="535" y="75" width="610" height="480" rx="30" fill="#fff" stroke="none"/><rect x="575" y="125" width="245" height="350" rx="18" fill="#f6f2e9" stroke="none"/><text x="599" y="174" font-size="20" fill="#087f78" font-weight="700">सेवा A</text><text x="602" y="270" font-size="48" fill="#153647" font-weight="750">₹255</text><path d="M599 310 L795 310" stroke="#bfd2ca" stroke-width="3" fill="none"/><text x="601" y="360" font-size="22" fill="#153647" font-weight="500">300 − 80 + 35</text><text x="601" y="415" font-size="18" fill="#153647" font-weight="500">अभी देय</text><rect x="850" y="125" width="245" height="350" rx="18" fill="#d9eee6" stroke="none"/><text x="874" y="174" font-size="20" fill="#087f78" font-weight="700">सेवा B</text><text x="877" y="270" font-size="48" fill="#153647" font-weight="750">₹250</text><path d="M874 310 L1070 310" stroke="#bfd2ca" stroke-width="3" fill="none"/><text x="876" y="360" font-size="22" fill="#153647" font-weight="500">270 − 30 + 10</text><text x="876" y="415" font-size="18" fill="#153647" font-weight="500">अभी देय</text><text x="590" y="518" font-size="19" fill="#087f78" font-weight="500">केवल उदाहरण • लाइव ऑफर नहीं</text></g></svg>